server:
  port: 8080
  mode: "debug" # 生产环境请改为 "release"

database:
  dsn: "user:password@tcp(127.0.0.1:3306)/blog_db?charset=utf8mb4&parseTime=True&loc=Local"

jwt:
  secret: "your-secret-key-change-me" # 请修改为复杂的随机字符串
  expire: 720 # JWT过期时间（小时）

system:
  posts_dir: "../frontend/src/content/posts"
  preview_dir: "../frontend/public/preview-cache"
  frontend_dir: "../frontend"
  diary_json_path: "./data/diary.json"

# 初始所有者配置（仅首次运行时使用）
init_data:
  owner_username: "admin"
  owner_password: "change-me"
  owner_qq: ""
  owner_phone: ""
